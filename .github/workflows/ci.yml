name: CI Test Suite & Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Go Tests & Integration Diagnostics
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook -d webhook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Apply Database Migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=webhook psql -h 127.0.0.1 -U webhook -d webhook -f migrations/001_init.sql
          PGPASSWORD=webhook psql -h 127.0.0.1 -U webhook -d webhook -f migrations/002_unique_event_id.sql

      - name: Compile Packages
        run: go build ./...

      - name: Run Integration & Unit Test Suite
        env:
          DATABASE_URL: "postgres://webhook:webhook@127.0.0.1:5432/webhook?sslmode=disable"
          REDIS_ADDR: "127.0.0.1:6379"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.out
